# 공통 실험 변수 (필요 시 수정)
apiVersion: v1
kind: ConfigMap
metadata:
  name: msa-benchmark-env
  namespace: msa-benchmark
data:
  APP_MODE: "no-auth"
  ARTIFICIAL_LATENCY_MS: "0"
  TRACING_SAMPLE_PROBABILITY: "1.0"
  JWT_SECRET: "benchmark-jwt-hmac-secret-key-min-32-bytes!!"
  # Jaeger OTLP (클러스터 내 Jaeger/Collector 주소로 교체)
  OTLP_TRACES_ENDPOINT: "http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces"
